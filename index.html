<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распределение бюджета по конвертам</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --income: #10b981;
            --income-bg: #ecfdf5;
            --expense: #ef4444;
            --expense-bg: #fef2f2;
            --warning: #f59e0b;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            padding: 30px 20px;
            max-width: 1100px; 
            margin: 0 auto; 
        }

        header { margin-bottom: 24px; text-align: center; }
        header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
        header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        /* Карточки общего состояния */
        .summary-cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
        }
        .card .label { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 6px;
        }
        .card .amount { font-size: 24px; font-weight: 700; }
        .card.income .amount { color: var(--income); }
        .card.allocated .amount { color: var(--primary); }
        .card.unallocated .amount { color: #8b5cf6; }
        .card.expense .amount { color: var(--expense); }

        /* Формы управления */
        .grid-forms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }
        @media (max-width: 800px) { .grid-forms { grid-template-columns: 1fr; } }

        .form-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .form-card h3 { font-size: 15px; margin-bottom: 12px; }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        input, select, button { 
            padding: 10px 12px; 
            font-size: 14px; 
            font-family: inherit;
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            background: var(--bg-main);
            color: var(--text-primary);
        }
        input:focus, select:focus { border-color: var(--primary); background: var(--surface); }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }

        /* Таблица Категорий (Конверты) */
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }

        .categories-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); 
            gap: 20px; 
        }
        
        .category-card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        
        .cat-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px;
        }
        .cat-title { font-weight: 700; font-size: 16px; }
        
        .budget-stats {
            background: #f8fafc;
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 14px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stat-row { display: flex; justify-content: space-between; }
        .stat-row.remains { font-weight: 700; border-top: 1px solid var(--border); pt: 6px; margin-top: 2px; }

        /* Прогресс-бар */
        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--income);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-bar-fill.overbudget { background: var(--expense); }

        /* Список операци */
        .tx-list { list-style: none; }
        .tx-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 6px 0; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 13px; 
        }
        .tx-item:last-child { border-bottom: none; }
        .del-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; }
        .del-btn:hover { color: var(--expense); }
    </style>
</head>
<body>

    <header>
        <h1>Планирование Бюджета по Категориям</h1>
        <p>Распределение поступающего дохода по конвертам расходов</p>
    </header>

    <!-- Сводка -->
    <div class="summary-cards">
        <div class="card income">
            <div class="label">Общий Поступивший Доход</div>
            <div class="amount" id="total-income">0 ₸</div>
        </div>
        <div class="card allocated">
            <div class="label">Распределено по категориям</div>
            <div class="amount" id="total-allocated">0 ₸</div>
        </div>
        <div class="card unallocated">
            <div class="label">Нераспределенный остаток</div>
            <div class="amount" id="unallocated-income">0 ₸</div>
        </div>
        <div class="card expense">
            <div class="label">Фактически Потрачено</div>
            <div class="amount" id="total-expense">0 ₸</div>
        </div>
    </div>

    <!-- Формы -->
    <div class="grid-forms">
        <!-- Ввод Дохода/Расхода -->
        <div class="form-card">
            <h3>+ Добавить транзакцию</h3>
            <form id="tx-form">
                <div class="form-row">
                    <input type="text" id="tx-title" placeholder="Название (напр. Зарплата / Продукты)" required>
                    <input type="number" step="0.01" id="tx-amount" placeholder="Сумма" required>
                    <select id="tx-type">
                        <option value="expense">Расход</option>
                        <option value="income">Доход (Приход)</option>
                    </select>
                    <input type="text" id="tx-category" placeholder="Категория" required>
                </div>
                <button type="submit" style="width: 100%; margin-top: 10px;">Сохранить транзакцию</button>
            </form>
        </div>

        <!-- Выделение денег на категорию -->
        <div class="form-card">
            <h3>🎯 Выделить бюджет из дохода</h3>
            <form id="budget-form">
                <div class="form-row">
                    <input type="text" id="b-category" placeholder="Категория (напр. Продукты)" required>
                    <input type="number" step="0.01" id="b-amount" placeholder="Выделить сумму (₸)" required>
                </div>
                <button type="submit" style="width: 100%; margin-top: 10px; background: #3b82f6;">Зафиксировать выделение</button>
            </form>
        </div>
    </div>

    <div class="section-title">Состояние «Конвертов» по Категориям</div>
    <div class="categories-grid" id="categories-container"></div>

    <script>
        function formatCurrency(val) {
            return new Intl.NumberFormat('ru-RU').format(val) + ' ₸';
        }

        async function loadData() {
            const [summaryRes, txRes, budgetRes] = await Promise.all([
                fetch('/api/summary'),
                fetch('/api/transactions'),
                fetch('/api/budgets')
            ]);

            const summary = await summaryRes.json();
            const transactions = await txRes.json();
            const budgets = await budgetRes.json();

            document.getElementById('total-income').innerText = formatCurrency(summary.total_income);
            document.getElementById('total-allocated').innerText = formatCurrency(summary.total_allocated);
            document.getElementById('unallocated-income').innerText = formatCurrency(summary.unallocated_income);
            document.getElementById('total-expense').innerText = formatCurrency(summary.total_expense);

            renderCategories(transactions, budgets);
        }

        function renderCategories(transactions, budgets) {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            const catMap = {};

            // Сначала загружаем выделенные бюджеты
            budgets.forEach(b => {
                catMap[b.category] = { allocated: b.allocated_amount, spent: 0, items: [] };
            });

            // Подсчитываем расходы по каждой категории
            transactions.forEach(tx => {
                if (tx.type === 'expense') {
                    const cName = tx.category.trim();
                    if (!catMap[cName]) {
                        catMap[cName] = { allocated: 0, spent: 0, items: [] };
                    }
                    catMap[cName].spent += tx.amount;
                    catMap[cName].items.push(tx);
                }
            });

            const categories = Object.keys(catMap);
            if (categories.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">Категории еще не настроены.</p>';
                return;
            }

            categories.forEach(catName => {
                const data = catMap[catName];
                const allocated = data.allocated;
                const spent = data.spent;
                const remains = allocated - spent;

                const percent = allocated > 0 ? Math.min(Math.round((spent / allocated) * 100), 100) : (spent > 0 ? 100 : 0);
                const isOver = spent > allocated && allocated > 0;

                const card = document.createElement('div');
                card.className = 'category-card';

                const itemsHtml = data.items.map(tx => `
                    <li class="tx-item">
                        <span>${tx.title}</span>
                        <span>
                            -${formatCurrency(tx.amount)}
                            <button class="del-btn" onclick="deleteTx(${tx.id})">&times;</button>
                        </span>
                    </li>
                `).join('');

                card.innerHTML = `
                    <div class="cat-header">
                        <span class="cat-title">📁 ${catName}</span>
                    </div>

                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill ${isOver ? 'overbudget' : ''}" style="width: ${percent}%;"></div>
                    </div>

                    <div class="budget-stats">
                        <div class="stat-row">
                            <span style="color: var(--text-secondary);">Выделено:</span>
                            <strong>${formatCurrency(allocated)}</strong>
                        </div>
                        <div class="stat-row">
                            <span style="color: var(--text-secondary);">Потрачено:</span>
                            <span style="color: var(--expense);">${formatCurrency(spent)}</span>
                        </div>
                        <div class="stat-row remains" style="padding-top: 4px;">
                            <span>Остаток в категории:</span>
                            <span style="color: ${remains < 0 ? 'var(--expense)' : 'var(--income)'}">${formatCurrency(remains)}</span>
                        </div>
                    </div>

                    <ul class="tx-list">
                        ${itemsHtml || '<li class="tx-item" style="color: #94a3b8">Нет расходов</li>'}
                    </ul>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('tx-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('tx-title').value,
                    amount: parseFloat(document.getElementById('tx-amount').value),
                    type: document.getElementById('tx-type').value,
                    category: document.getElementById('tx-category').value
                })
            });
            document.getElementById('tx-title').value = '';
            document.getElementById('tx-amount').value = '';
            loadData();
        });

        document.getElementById('budget-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/budgets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    category: document.getElementById('b-category').value,
                    allocated_amount: parseFloat(document.getElementById('b-amount').value)
                })
            });
            document.getElementById('b-category').value = '';
            document.getElementById('b-amount').value = '';
            loadData();
        });

        async function deleteTx(id) {
            if (confirm('Удалить эту операцию?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
