<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Бюджет</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --income: #10b981;
            --income-bg: #ecfdf5;
            --expense: #ef4444;
            --expense-bg: #fef2f2;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            padding: 30px 20px;
            max-width: 1080px; 
            margin: 0 auto; 
            -webkit-font-smoothing: antialiased;
        }

        /* Заголовок */
        header {
            margin-bottom: 28px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Карточки общего баланса */
        .summary-cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .card { 
            background: var(--surface); 
            padding: 20px 24px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .card .label { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 8px;
        }
        .card .amount { 
            font-size: 26px; 
            font-weight: 700; 
            letter-spacing: -0.02em;
        }
        .card.balance .amount { color: var(--primary); }
        .card.income .amount { color: var(--income); }
        .card.expense .amount { color: var(--expense); }

        /* Форма ввода */
        .form-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 32px;
        }
        form { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1fr auto; 
            gap: 12px; 
        }
        @media (max-width: 768px) {
            form { grid-template-columns: 1fr; }
        }
        input, select, button { 
            padding: 12px 16px; 
            font-size: 14px; 
            font-family: inherit;
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            background: var(--bg-main);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        input:focus, select:focus { 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background: var(--surface);
        }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            padding: 12px 24px;
            border-radius: var(--radius-md);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }
        button:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
        }

        /* Заголовок секции */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        /* Сетка категорий */
        .categories-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 20px; 
        }
        
        /* Блок категории */
        .category-block { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            transition: box-shadow 0.2s;
        }
        .category-block:hover {
            box-shadow: var(--shadow-md);
        }
        .category-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-bottom: 12px; 
            margin-bottom: 12px; 
            border-bottom: 1px solid var(--border);
        }
        .category-title { 
            font-weight: 600; 
            font-size: 16px; 
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-total { 
            font-weight: 700; 
            font-size: 15px; 
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--expense-bg);
            color: var(--expense);
        }
        .category-block.income-block .category-total { 
            background: var(--income-bg);
            color: var(--income); 
        }

        /* Список операций */
        .tx-list { list-style: none; }
        .tx-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 14px; 
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-info { display: flex; flex-direction: column; gap: 2px; }
        .tx-title { font-weight: 500; color: var(--text-primary); }
        .tx-date { font-size: 12px; color: var(--text-secondary); }
        .tx-amount { 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .del-btn { 
            background: none; 
            border: none; 
            color: var(--text-secondary); 
            cursor: pointer; 
            font-size: 18px; 
            padding: 4px; 
            line-height: 1;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .del-btn:hover { 
            color: var(--expense); 
            background: var(--expense-bg);
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1>Управление Семейным Бюджетом</h1>
        <p>Учет доходов, расходов и аналитика по категориям</p>
    </header>

    <!-- Сводка -->
    <div class="summary-cards">
        <div class="card balance">
            <div class="label">Текущий Остаток</div>
            <div class="amount" id="balance">0 ₸</div>
        </div>
        <div class="card income">
            <div class="label">Всего Доходов</div>
            <div class="amount" id="total-income">0 ₸</div>
        </div>
        <div class="card expense">
            <div class="label">Всего Расходов</div>
            <div class="amount" id="total-expense">0 ₸</div>
        </div>
    </div>

    <!-- Форма создания -->
    <div class="form-card">
        <form id="tx-form">
            <input type="text" id="title" placeholder="Описание (напр. Покупка продуктов)" required>
            <input type="number" step="0.01" id="amount" placeholder="Сумма" required>
            <select id="type">
                <option value="expense">Расход</option>
                <option value="income">Доход</option>
            </select>
            <input type="text" id="category" placeholder="Категория (напр. Еда)" required>
            <button type="submit">+ Добавить</button>
        </form>
    </div>

    <!-- Категории -->
    <div class="section-title">Категории и транзакции</div>
    <div class="categories-grid" id="categories-container"></div>

    <script>
        function formatCurrency(val) {
            return new Intl.NumberFormat('ru-RU').format(val) + ' ₸';
        }

        async function loadSummary() {
            const res = await fetch('/api/summary');
            const data = await res.json();
            document.getElementById('balance').innerText = formatCurrency(data.balance);
            document.getElementById('total-income').innerText = formatCurrency(data.total_income);
            document.getElementById('total-expense').innerText = formatCurrency(data.total_expense);
        }

        async function loadTransactions() {
            const res = await fetch('/api/transactions');
            const transactions = await res.json();
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            if (transactions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 16px; font-weight: 500;">Записей пока нет</p>
                        <p style="font-size: 13px; margin-top: 4px;">Заполните форму выше, чтобы добавить первую операцию.</p>
                    </div>
                `;
                return;
            }

            const categories = {};
            transactions.forEach(tx => {
                const catName = tx.category.trim() || 'Разное';
                if (!categories[catName]) {
                    categories[catName] = { items: [], totalExpense: 0, totalIncome: 0 };
                }
                categories[catName].items.push(tx);
                if (tx.type === 'expense') {
                    categories[catName].totalExpense += tx.amount;
                } else {
                    categories[catName].totalIncome += tx.amount;
                }
            });

            Object.keys(categories).forEach(catName => {
                const cat = categories[catName];
                const block = document.createElement('div');
                const isIncomeOnly = cat.totalExpense === 0 && cat.totalIncome > 0;
                
                block.className = `category-block ${isIncomeOnly ? 'income-block' : ''}`;
                
                let totalText = '';
                if (cat.totalExpense > 0 && cat.totalIncome > 0) {
                    totalText = `+${formatCurrency(cat.totalIncome)} / -${formatCurrency(cat.totalExpense)}`;
                } else if (cat.totalIncome > 0) {
                    totalText = `+${formatCurrency(cat.totalIncome)}`;
                } else {
                    totalText = `-${formatCurrency(cat.totalExpense)}`;
                }

                let itemsHtml = cat.items.map(item => `
                    <li class="tx-item">
                        <div class="tx-info">
                            <span class="tx-title">${item.title}</span>
                            <span class="tx-date">${new Date(item.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })}</span>
                        </div>
                        <div class="tx-amount" style="color: ${item.type === 'income' ? 'var(--income)' : 'var(--expense)'}">
                            ${item.type === 'income' ? '+' : '-'}${formatCurrency(item.amount)}
                            <button class="del-btn" onclick="deleteTx(${item.id})" title="Удалить">&times;</button>
                        </div>
                    </li>
                `).join('');

                block.innerHTML = `
                    <div>
                        <div class="category-header">
                            <span class="category-title">📂 ${catName}</span>
                            <span class="category-total">${totalText}</span>
                        </div>
                        <ul class="tx-list">
                            ${itemsHtml}
                        </ul>
                    </div>
                `;
                container.appendChild(block);
            });
        }

        document.getElementById('tx-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const category = document.getElementById('category').value;

            await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, amount, type, category })
            });

            document.getElementById('title').value = '';
            document.getElementById('amount').value = '';
            loadSummary();
            loadTransactions();
        });

        async function deleteTx(id) {
            if (confirm('Удалить эту операцию?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadSummary();
                loadTransactions();
            }
        }

        loadSummary();
        loadTransactions();
    </script>
</body>
</html>
