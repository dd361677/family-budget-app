<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансовый Менеджер и Бюджетирование</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f1f5f9;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --income: #10b981;
            --income-bg: #ecfdf5;
            --expense: #ef4444;
            --expense-bg: #fef2f2;
            --warning: #f59e0b;
            --warning-bg: #fffbebfb;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            padding: 30px 20px;
            max-width: 1140px; 
            margin: 0 auto; 
        }

        header {
            margin-bottom: 28px;
            text-align: center;
        }
        header h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
        header p { color: var(--text-secondary); font-size: 15px; margin-top: 4px; }

        /* Сводка */
        .summary-cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
        }
        .card .label { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-secondary); 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 6px;
        }
        .card .amount { font-size: 24px; font-weight: 700; }
        .card.balance .amount { color: var(--primary); }
        .card.income .amount { color: var(--income); }
        .card.budget .amount { color: #8b5cf6; }
        .card.expense .amount { color: var(--expense); }

        /* Формы */
        .grid-forms {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }
        @media (max-width: 850px) {
            .grid-forms { grid-template-columns: 1fr; }
        }

        .form-card {
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .form-card h3 {
            font-size: 15px;
            margin-bottom: 14px;
            color: var(--text-primary);
        }

        .tx-form-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr auto;
            gap: 10px;
        }
        .budget-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .tx-form-grid, .budget-form-grid { grid-template-columns: 1fr; }
        }

        input, select, button { 
            padding: 11px 14px; 
            font-size: 14px; 
            font-family: inherit;
            border: 1px solid var(--border); 
            border-radius: var(--radius-md); 
            outline: none; 
            background: var(--bg-main);
            color: var(--text-primary);
        }
        input:focus, select:focus { 
            border-color: var(--primary); 
            background: var(--surface);
        }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: 600; 
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }

        /* Категории */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .categories-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 20px; 
        }
        
        .category-block { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        
        .category-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
        }
        .category-title { font-weight: 600; font-size: 16px; }
        .category-budget-tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: #f1f5f9;
            color: var(--text-secondary);
        }

        /* Прогресс-бар */
        .progress-container {
            margin-bottom: 16px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-bar-fill.overbudget {
            background: var(--expense);
        }

        /* Транзакции */
        .tx-list { list-style: none; }
        .tx-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 0; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 13px; 
        }
        .tx-item:last-child { border-bottom: none; }
        .tx-title { font-weight: 500; }
        .tx-date { font-size: 11px; color: var(--text-secondary); }
        .del-btn { 
            background: none; border: none; color: #94a3b8; 
            cursor: pointer; font-size: 16px; padding: 2px 6px;
        }
        .del-btn:hover { color: var(--expense); }
    </style>
</head>
<body>

    <header>
        <h1>Семейный Бюджет & Планирование</h1>
        <p>Управление бюджетом по категориям, доходы и расходы</p>
    </header>

    <!-- Карточки -->
    <div class="summary-cards">
        <div class="card balance">
            <div class="label">Текущий Остаток</div>
            <div class="amount" id="balance">0 ₸</div>
        </div>
        <div class="card income">
            <div class="label">Общий Доход</div>
            <div class="amount" id="total-income">0 ₸</div>
        </div>
        <div class="card budget">
            <div class="label">Выделено в Бюджеты</div>
            <div class="amount" id="total-budgeted">0 ₸</div>
        </div>
        <div class="card expense">
            <div class="label">Всего Потрачено</div>
            <div class="amount" id="total-expense">0 ₸</div>
        </div>
    </div>

    <!-- Формы -->
    <div class="grid-forms">
        <!-- Форма операции -->
        <div class="form-card">
            <h3>+ Добавить транзакцию</h3>
            <form id="tx-form" class="tx-form-grid">
                <input type="text" id="tx-title" placeholder="Описание" required>
                <input type="number" step="0.01" id="tx-amount" placeholder="Сумма" required>
                <select id="tx-type">
                    <option value="expense">Расход</option>
                    <option value="income">Доход</option>
                </select>
                <input type="text" id="tx-category" placeholder="Категория" required>
                <button type="submit" style="grid-column: span 4;">Записать</button>
            </form>
        </div>

        <!-- Форма планирования бюджета -->
        <div class="form-card">
            <h3>🎯 Задать лимит на категорию</h3>
            <form id="budget-form" class="budget-form-grid">
                <input type="text" id="b-category" placeholder="Категория" required>
                <input type="number" step="0.01" id="b-amount" placeholder="Лимит (₸)" required>
                <button type="submit">Сохранить</button>
            </form>
        </div>
    </div>

    <div class="section-title">Категории и освоение бюджета</div>
    <div class="categories-grid" id="categories-container"></div>

    <script>
        function formatCurrency(val) {
            return new Intl.NumberFormat('ru-RU').format(val) + ' ₸';
        }

        async function loadData() {
            const [summaryRes, txRes, budgetRes] = await Promise.all([
                fetch('/api/summary'),
                fetch('/api/transactions'),
                fetch('/api/budgets')
            ]);

            const summary = await summaryRes.json();
            const transactions = await txRes.json();
            const budgets = await budgetRes.json();

            document.getElementById('balance').innerText = formatCurrency(summary.balance);
            document.getElementById('total-income').innerText = formatCurrency(summary.total_income);
            document.getElementById('total-budgeted').innerText = formatCurrency(summary.total_budgeted);
            document.getElementById('total-expense').innerText = formatCurrency(summary.total_expense);

            renderCategories(transactions, budgets);
        }

        function renderCategories(transactions, budgets) {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            // Группировка
            const catMap = {};

            // Инициализируем из настроенных бюджетов
            budgets.forEach(b => {
                catMap[b.category] = { allocated: b.allocated_amount, spent: 0, income: 0, items: [] };
            });

            // Наполняем транзакциями
            transactions.forEach(tx => {
                const cName = tx.category.trim();
                if (!catMap[cName]) {
                    catMap[cName] = { allocated: 0, spent: 0, income: 0, items: [] };
                }
                catMap[cName].items.push(tx);
                if (tx.type === 'expense') {
                    catMap[cName].spent += tx.amount;
                } else {
                    catMap[cName].income += tx.amount;
                }
            });

            const categories = Object.keys(catMap);
            if (categories.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">Категорий пока нет.</p>';
                return;
            }

            categories.forEach(catName => {
                const data = catMap[catName];
                const block = document.createElement('div');
                block.className = 'category-block';

                const allocated = data.allocated;
                const spent = data.spent;
                const percent = allocated > 0 ? Math.min(Math.round((spent / allocated) * 100), 100) : 0;
                const isOver = allocated > 0 && spent > allocated;

                let progressHtml = '';
                if (allocated > 0) {
                    progressHtml = `
                        <div class="progress-container">
                            <div class="progress-info">
                                <span>Потрачено: ${formatCurrency(spent)} из ${formatCurrency(allocated)}</span>
                                <span style="color: ${isOver ? 'var(--expense)' : 'var(--text-secondary)'}">${percent}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill ${isOver ? 'overbudget' : ''}" style="width: ${percent}%;"></div>
                            </div>
                        </div>
                    `;
                }

                const itemsHtml = data.items.map(tx => `
                    <li class="tx-item">
                        <div>
                            <span class="tx-title">${tx.title}</span>
                            <div class="tx-date">${new Date(tx.created_at).toLocaleDateString('ru-RU')}</div>
                        </div>
                        <div style="font-weight: 600; color: ${tx.type === 'income' ? 'var(--income)' : 'var(--text-primary)'}">
                            ${tx.type === 'income' ? '+' : '-'}${formatCurrency(tx.amount)}
                            <button class="del-btn" onclick="deleteTx(${tx.id})">&times;</button>
                        </div>
                    </li>
                `).join('');

                block.innerHTML = `
                    <div class="category-header">
                        <span class="category-title">📂 ${catName}</span>
                        <span class="category-budget-tag">Лимит: ${allocated > 0 ? formatCurrency(allocated) : 'не задан'}</span>
                    </div>
                    ${progressHtml}
                    <ul class="tx-list">
                        ${itemsHtml || '<li class="tx-item" style="color:#94a3b8">Нет операций</li>'}
                    </ul>
                `;
                container.appendChild(block);
            });
        }

        // Добавление транзакции
        document.getElementById('tx-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: document.getElementById('tx-title').value,
                    amount: parseFloat(document.getElementById('tx-amount').value),
                    type: document.getElementById('tx-type').value,
                    category: document.getElementById('tx-category').value
                })
            });
            document.getElementById('tx-title').value = '';
            document.getElementById('tx-amount').value = '';
            loadData();
        });

        // Установка бюджета
        document.getElementById('budget-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/budgets', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    category: document.getElementById('b-category').value,
                    allocated_amount: parseFloat(document.getElementById('b-amount').value)
                })
            });
            document.getElementById('b-category').value = '';
            document.getElementById('b-amount').value = '';
            loadData();
        });

        async function deleteTx(id) {
            if (confirm('Удалить запись?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        loadData();
    </script>
</body>
</html>
